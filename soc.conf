# socs/lga/soc.conf: the facts of a Google Tensor G5 ("laguna", lga), whatever Pixel 10 it is in (frankel, blazer, mustang).
# Its own repository (Scion-Project/scion-soc-lga), cloned here by tools/hakios-device.py sync; a phone with this SoC includes
# configs/lga.config from its defconfig. docs/porting/repositories.md has every word; README.md has each fact's source.

soc lga
	title       Google Tensor G5 (laguna, "lga")
	vendor      Google
	cores       8: two Cortex-A520 (0-1, MPIDR 0x000-0x100), five Cortex-A725 (2-6, 0x200-0x600), one Cortex-X4 (7, 0x700); the biggest is core 7
	gpu         Imagination PowerVR DXT-48-1536
	maintainer  Scion (README.md)
	source      M linux@18686b294c6f arch/arm64/boot/dts/google/lga.dtsi, lga-pixel-common.dtsi
	source      G azagramac/pixel10-kernel-aosp@6f689be7fa23, Google's kernel for the Pixel 10 family: facts only
	source      F Google's factory image cp3a.261005.005: names and headers, read only
	block       cpu   code      M  A520, A725 and X4, ARMv9.2; under this kernel only in QEMU
	block       acpm  different G  no ACPM: the CPM, Google's power manager, by mailbox
	block       gic   table     M  GICv3 with 256 KB GICv4 frames, walked by gic_v3_irq.c
	block       timer table     M  architected; CNTFRQ_EL0 is the firmware's
	block       uart  different M  DesignWare APB UART, 16550-style
	block       ufs   different G  Google's host at 0x3C400000, behind an SMMUv3
	block       usb   unknown   -  not looked at
	block       dpu   different G  VeriSilicon DC9x00; the boot loader's framebuffer is the shim's, unproven
	block       gpu   different F  PowerVR DXT-48-1536, Volcanic, signed firmware by way of Trusty; no open driver
	block       mfc   unknown   -  not looked at
	block       usi   unknown   -  not looked at
	block       pmic  different G  DA9188 and DA9189, through the CPM
	block       wdt   different M  google,wdt, two; the shim stops them
